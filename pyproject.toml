[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperq"
version = "0.1.0"
authors = [
  { name = "Martin Monperrus", email = "martin.monperrus@gmail.com" },
]
description = "Automated, validated quality assessment of scientific papers"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "requests",
    "feedparser",
    "check-hallucinations>=0.23",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "types-requests"]

[project.scripts]
paperq = "paperq.main:main"

[tool.hatch.build.targets.wheel]
packages = ["paperq"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
